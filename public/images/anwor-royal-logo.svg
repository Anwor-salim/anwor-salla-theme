<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="280" height="80">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#edd6b1"/>
      <stop offset="50%" stop-color="#cca36e"/>
      <stop offset="100%" stop-color="#a87f43"/>
    </linearGradient>
  </defs>
  <!-- Royal Perfume Emblem -->
  <g transform="translate(140, 20) scale(0.9)" stroke="url(#goldGrad)" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center bud / flame -->
    <path d="M0 -14 C2 -7, 3 -3, 0 3 C-3 -3, -2 -7, 0 -14 Z" fill="url(#goldGrad)"/>
    <!-- Inner petals -->
    <path d="M-2 2 C-7 -4, -9 -10, -5 -13 C-2 -10, 0 -3, 0 3"/>
    <path d="M2 2 C7 -4, 9 -10, 5 -13 C2 -10, 0 -3, 0 3"/>
    <!-- Outer petals -->
    <path d="M-4 3 C-12 -2, -14 -8, -10 -11 C-7 -7, -2 0, 0 4"/>
    <path d="M4 3 C12 -2, 14 -8, 10 -11 C7 -7, 2 0, 0 4"/>
    <!-- Base arch -->
    <path d="M-8 4 C-4 6, 4 6, 8 4" stroke-width="1.2"/>
  </g>
  <!-- ANWOR Brand Name -->
  <text x="140" y="54" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', 'Times New Roman', serif" font-size="21" font-weight="700" letter-spacing="5" fill="url(#goldGrad)">ANWOR</text>
  <!-- Subtitle -->
  <text x="140" y="68" text-anchor="middle" font-family="'Montserrat', 'Inter', sans-serif" font-size="6.5" font-weight="600" letter-spacing="3.2" fill="#c5a880">SCENTS OF LUXURY</text>
</svg>
